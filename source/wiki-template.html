<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Wiki｜記憶練習簿</title>
  <meta name="description" content="間隔學習與提取練習的 LLM Wiki。瀏覽概念、研究證據及適用範圍。">
  <style>
    :root {
      color-scheme: light;
      --ink: #152647;
      --subtle: #4d5d78;
      --navy: #142748;
      --deep: #0e1e39;
      --paper: #f4f7fc;
      --white: #fff;
      --rule: #c9d5e8;
      --blue: #1f479e;
      --yellow: #f9e384;
      --reading: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --display: "Noto Serif TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--reading); line-height: 1.7; }
    a { color: var(--blue); text-underline-offset: .22em; }
    a:hover { text-decoration-thickness: .13em; }
    :focus-visible { outline: 3px solid #3261c9; outline-offset: 4px; }
    [hidden] { display: none !important; }
    [id] { scroll-margin-top: 1.75rem; }
    .shell { width: min(78rem, 100% - 4rem); margin-inline: auto; }
    .skip { position: fixed; z-index: 4; inset: .5rem auto auto .5rem; background: var(--yellow); color: var(--deep); padding: .5rem .75rem; transform: translateY(-160%); }
    .skip:focus { transform: none; }
    .top { background: var(--deep); color: var(--white); }
    .top .shell { display: flex; justify-content: space-between; align-items: center; gap: .75rem 2rem; flex-wrap: wrap; min-height: 4rem; padding-block: .65rem; }
    .top a { color: #e9effe; }
    .top a:focus-visible, .hero a:focus-visible { outline-color: var(--yellow); }
    .brand { display: inline-flex; align-items: center; gap: .65rem; font-weight: 800; text-decoration: none; }
    .brand::before { content: ""; width: .84rem; height: 1.05rem; border: 1px solid var(--yellow); border-left-width: 4px; border-radius: .125rem; }
    .site-nav { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem 1.4rem; font-size: .925rem; }
    .site-nav [aria-current] { color: var(--yellow); }

    .hero {
      color: var(--white);
      border-bottom: .3rem solid var(--yellow);
      background-color: var(--navy);
      background-image: linear-gradient(90deg, var(--navy) 25%, transparent 82%), linear-gradient(#abc6fd17 1px, transparent 1px), linear-gradient(90deg, #abc6fd17 1px, transparent 1px);
      background-size: auto, 1.55rem 1.55rem, 1.55rem 1.55rem;
    }
    .hero .shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, .35fr); align-items: end; gap: 2rem 4rem; padding-block: clamp(2.9rem, 6vw, 5.75rem); }
    .hero h1 { max-width: 22ch; margin: .38rem 0 1rem; color: #fff; line-height: 1.23; font: 800 clamp(2.4rem, 6vw, 4.7rem)/1.22 var(--display); letter-spacing: -.04em; }
    .hero p { margin: 0; }
    .hero-kind { color: var(--yellow); font-size: .9rem; letter-spacing: .05em; font-weight: 800; }
    .hero-intro { max-width: 42em; color: #dce7fc; font-size: clamp(1rem, 1.55vw, 1.18rem); }
    .notebook-index { align-self: end; margin: 0 0 .32rem; padding: 0; list-style: none; border-top: 1px solid #a4b7da80; }
    .notebook-index li { display: flex; align-items: baseline; gap: .7rem; border-bottom: 1px solid #a4b7da80; }
    .notebook-index a { display: flex; align-items: baseline; gap: .85rem; width: 100%; padding: .56rem 0; color: #ecf3ff; text-decoration: none; }
    .notebook-index a:hover { color: var(--yellow); text-decoration: underline; }
    .notebook-index strong { min-width: 2ch; color: var(--yellow); font: 700 1.3rem/1.3 var(--display); font-variant-numeric: tabular-nums; }

    .layout { display: grid; grid-template-columns: minmax(13rem, .28fr) minmax(0, 1fr); gap: clamp(2rem, 5vw, 5rem); align-items: start; padding-block: clamp(2.15rem, 4.7vw, 4rem) 5rem; }
    .sidebar { position: sticky; top: 1.25rem; }
    .search label, .topic-nav h2 { display: block; margin: 0 0 .55rem; font-size: 1rem; font-weight: 850; }
    .search-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .55rem; }
    .search input { width: 100%; min-height: 2.65rem; padding: .45rem .65rem; border: 1px solid #a4b5d1; border-radius: .25rem; color: var(--ink); background: var(--white); font: inherit; }
    .search button { border: 1px solid #a4b5d1; border-radius: .25rem; background: var(--white); padding: .4rem .65rem; color: var(--blue); cursor: pointer; font: inherit; }
    .search button:hover { background: #e8effc; }
    .search-status { min-height: 1.5rem; margin: .5rem 0 0; color: var(--subtle); font-size: .875rem; }
    .topic-nav { margin-top: 1.55rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
    .topic-nav ul { display: grid; gap: .25rem; margin: 0; padding: 0; list-style: none; }
    .topic-nav a { display: inline-block; padding-block: .22rem; text-decoration: none; }
    .topic-nav a:hover { text-decoration: underline; }

    .section-title { display: flex; flex-wrap: wrap; gap: .3rem .9rem; align-items: baseline; border-bottom: 2px solid var(--ink); margin: 0 0 1.4rem; padding: 0 0 .65rem; }
    .section-title h2 { margin: 0; font: 800 clamp(1.55rem, 3vw, 2.15rem)/1.25 var(--display); }
    .section-title p { margin: 0; color: var(--subtle); font-size: .9rem; }
    .topic + .topic { margin-top: 2.85rem; }
    .topic h3 { margin: 0; font: 800 1.48rem/1.4 var(--display); }
    .topic-summary { max-width: 44em; margin: .4rem 0 1rem; color: var(--subtle); }
    .claim {
      display: grid;
      grid-template-columns: 4.1rem minmax(0, 1fr);
      gap: .25rem 1rem;
      padding: 1rem clamp(.8rem, 2vw, 1.25rem) 1.05rem;
      background: var(--white);
      border-top: 1px solid var(--rule);
      border-inline: 1px solid var(--rule);
    }
    .claim:last-child { border-bottom: 1px solid var(--rule); }
    .claim:target, .paper:target { background: #fffbeb; box-shadow: inset .25rem 0 0 #aa7b0c; }
    .claim-label, .paper-label { display: inline-block; align-self: start; justify-self: start; color: var(--blue); font-size: .83rem; letter-spacing: .015em; font-weight: 800; text-decoration: none; }
    .claim-label { margin-top: .24rem; }
    .claim-label:hover, .paper-label:hover { text-decoration: underline; }
    .claim h4 { margin: 0; font-size: 1.04rem; line-height: 1.65; }
    .claim-context { margin: .5rem 0 0; color: var(--subtle); }
    .evidence, .related { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .6rem; margin: .65rem 0 0; font-size: .875rem; }
    .evidence span, .related span { color: var(--subtle); }
    .evidence a { padding: .03rem .4rem; border: 1px solid #c3d1ea; border-radius: .2rem; background: #edf3ff; font-weight: 700; }
    .related a { font-weight: 650; }
    .sources { margin-top: clamp(3rem, 6vw, 5rem); }
    .paper { background: var(--white); border: 1px solid var(--rule); padding: 1.3rem clamp(1rem, 3vw, 1.65rem); overflow-wrap: anywhere; }
    .paper + .paper { margin-top: .9rem; }
    .paper h3 { font-size: 1.1rem; line-height: 1.45; margin: .3rem 0 .25rem; }
    .paper-meta { margin: 0 0 .8rem; font-size: .91rem; color: var(--subtle); }
    .paper dl { margin: 0 0 .85rem; }
    .paper dl > div { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: .15rem .8rem; padding: .54rem 0; border-top: 1px solid var(--rule); }
    .paper dt { font-weight: 800; }
    .paper dd { margin: 0; }
    .paper-links { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .7rem; margin: 0; font-size: .925rem; }
    .paper-links span { color: var(--subtle); }
    .empty { border: 1px solid var(--rule); padding: 1rem 1.2rem; background: var(--white); }
    .foot { background: var(--deep); color: #e2ecff; }
    .foot .shell { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem 1rem; padding-block: 1rem; }
    .foot p { margin: 0; }
    .foot a { color: var(--yellow); }
    .foot a:focus-visible { outline-color: var(--yellow); }

    @media (max-width: 51rem) {
      .shell { width: min(100% - 2.3rem, 78rem); }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 1.8rem; }
      .sidebar { position: static; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
      .topic-nav { margin: 0; padding-top: 0; border-top: 0; }
    }
    @media (max-width: 34rem) {
      .hero .shell, .sidebar { grid-template-columns: minmax(0, 1fr); }
      .hero .shell { gap: 1.35rem; }
      .notebook-index { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
      .site-nav { gap: .55rem 1.05rem; }
      .topic-nav { padding-top: .9rem; border-top: 1px solid var(--rule); }
      .topic-nav ul { column-gap: .8rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .claim { grid-template-columns: minmax(0, 1fr); }
      .claim-label { margin-top: 0; }
      .paper dl > div { grid-template-columns: minmax(0, 1fr); }
    }
    @media print {
      body, .hero { background: #fff; color: #000; }
      .hero h1, .hero-intro, .hero-kind { color: #000; }
      .top, .sidebar, .foot, .notebook-index { display: none; }
      .shell { width: 100%; }
      .layout, .hero .shell { display: block; padding-block: 1rem; }
      .claim, .paper { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip">跳到主要內容</a>
  <header class="top">
    <div class="shell">
      <a class="brand" href="index.html">記憶練習簿</a>
      <nav class="site-nav" aria-label="成果導覽">
        <a href="index.html">教學簡報</a>
        <a href="wiki.html" aria-current="page">LLM Wiki</a>
        <a href="workflow.html">製作流程與檢查</a>
      </nav>
    </div>
  </header>
  <div class="hero" id="top">
    <div class="shell">
      <div>
        <p class="hero-kind">LLM Wiki</p>
        <h1 id="wiki-title">間隔學習與提取練習</h1>
        <p class="hero-intro" id="wiki-intro"></p>
      </div>
      <ul class="notebook-index" aria-label="Wiki 概況">
        <li><a href="#concepts"><strong id="topic-count"></strong>個概念頁</a></li>
        <li><a href="#sources"><strong id="source-count"></strong>篇原始研究</a></li>
      </ul>
    </div>
  </div>
  <main class="shell layout" id="main-content" tabindex="-1">
    <aside class="sidebar" aria-label="Wiki 檢索">
      <div class="search" role="search">
        <label for="query">搜尋 Wiki</label>
        <div class="search-box">
          <input id="query" type="search" placeholder="例如：間隔、S1" aria-describedby="search-status">
          <button type="button" id="clear-search" hidden>清除</button>
        </div>
        <p class="search-status" id="search-status" role="status"></p>
      </div>
      <nav class="topic-nav" aria-label="Wiki 頁面索引">
        <h2>頁面索引</h2>
        <ul id="topic-nav"></ul>
      </nav>
    </aside>
    <div>
      <noscript>請啟用 JavaScript 以瀏覽內嵌的 Wiki 資料。</noscript>
      <p class="empty" id="empty-results" hidden>沒有符合的頁面。可試試概念名稱、作者或來源編號。</p>
      <section id="concepts" aria-labelledby="concepts-title">
        <div class="section-title">
          <h2 id="concepts-title">概念與證據</h2>
          <p>點選來源編號閱讀研究整理，或查看 <a href="wiki/index.md">Markdown 概念頁索引</a>。</p>
        </div>
        <div id="concept-list"></div>
      </section>
      <section class="sources" id="sources" aria-labelledby="sources-title">
        <div class="section-title">
          <h2 id="sources-title">研究來源</h2>
          <p>依方法、結果與適用範圍整理。</p>
        </div>
        <div id="source-list"></div>
      </section>
    </div>
  </main>
  <footer class="foot"><div class="shell"><p>記憶練習簿</p><a href="#top">回到頁首</a></div></footer>

  <script type="application/json" id="wiki-data">{{WIKI_DATA}}</script>
  <script>
    const wiki = JSON.parse(document.getElementById('wiki-data').textContent);
    const get = id => document.getElementById(id);
    const sourceById = new Map(wiki.sources.map(source => [source.id, source]));
    const topicById = new Map(wiki.topics.map(topic => [topic.id, topic]));

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function link(text, target, className) {
      const anchor = element('a', className, text);
      anchor.href = target;
      return anchor;
    }

    function chipList(className, label, links) {
      const list = element('p', className);
      list.append(element('span', '', label), ...links);
      return list;
    }

    function renderClaim(claim) {
      const article = element('article', 'claim');
      article.id = claim.id;
      const body = element('div');
      body.append(element('h4', '', claim.text));
      if (claim.context) body.append(element('p', 'claim-context', claim.context));
      const citations = claim.sourceIds.map(id => {
        const anchor = link(id, `#${id}`);
        const source = sourceById.get(id);
        if (source) anchor.setAttribute('aria-label', `${id} ${source.title}`);
        return anchor;
      });
      body.append(chipList('evidence', '研究來源', citations));
      const identifier = link(claim.id, `#${claim.id}`, 'claim-label');
      identifier.setAttribute('aria-label', `${claim.id} 主張的直接連結`);
      article.append(identifier, body);
      return article;
    }

    function renderTopic(topic) {
      const section = element('section', 'topic');
      section.id = topic.id;
      const heading = element('h3', '', topic.title);
      const claims = element('div');
      claims.append(...topic.claims.map(renderClaim));
      section.append(heading, element('p', 'topic-summary', topic.summary), claims);
      if (topic.seeAlso?.length) {
        const related = topic.seeAlso.map(id => link(topicById.get(id)?.title || id, `#${id}`));
        section.append(chipList('related', '相關概念', related));
      }
      return section;
    }

    function renderSource(source) {
      const article = element('article', 'paper');
      article.id = source.id;
      const authorNames = Array.isArray(source.authors) ? source.authors.join('、') : source.authors;
      const meta = [authorNames, source.year, source.journal].filter(Boolean).join(' · ');
      const identifier = link(source.id, `#${source.id}`, 'paper-label');
      identifier.setAttribute('aria-label', `${source.id} 研究來源的直接連結`);
      article.append(identifier, element('h3', '', source.title), element('p', 'paper-meta', meta));
      const summary = element('dl');
      for (const [label, text] of [['研究方法', source.method], ['主要結果', source.result], ['適用範圍', source.limit]]) {
        const row = element('div');
        row.append(element('dt', '', label), element('dd', '', text));
        summary.append(row);
      }
      const paperLinks = element('p', 'paper-links');
      const original = link('查看原始研究', source.url);
      original.setAttribute('aria-label', `查看原始研究 ${source.title}`);
      const raw = link('採錄摘句', source.rawPath);
      raw.setAttribute('aria-label', `查看 ${source.id} 的原始資料卡與採錄摘句`);
      paperLinks.append(raw, original);
      if (source.doi) paperLinks.append(element('span', '', `DOI ${source.doi}`));
      article.append(summary, paperLinks);
      return article;
    }

    get('wiki-title').textContent = wiki.title;
    get('wiki-intro').textContent = wiki.intro;
    get('topic-count').textContent = wiki.topics.length;
    get('source-count').textContent = wiki.sources.length;
    document.title = `${wiki.title}｜LLM Wiki`;
    for (const topic of wiki.topics) {
      const entry = element('li');
      entry.append(link(topic.title, `#${topic.id}`));
      get('topic-nav').append(entry);
      get('concept-list').append(renderTopic(topic));
    }
    const sourcesEntry = element('li');
    sourcesEntry.append(link('研究來源', '#sources'));
    get('topic-nav').append(sourcesEntry);
    get('source-list').append(...wiki.sources.map(renderSource));

    function searchable(parts) {
      return parts.flat(Infinity).filter(Boolean).join(' ').normalize('NFKC').toLocaleLowerCase();
    }

    const topicIndex = wiki.topics.map(topic => ({
      node: get(topic.id),
      text: searchable([topic.id, topic.title, topic.summary, topic.claims.map(claim => [claim.id, claim.text, claim.context, claim.sourceIds])])
    }));
    const sourceIndex = wiki.sources.map(source => ({
      node: get(source.id),
      text: searchable([source.id, source.title, source.authors, source.year, source.journal, source.doi, source.method, source.result, source.limit])
    }));
    const search = get('query');
    const clear = get('clear-search');

    function showMatches(index, terms) {
      let count = 0;
      for (const {node, text} of index) {
        const matches = terms.every(term => text.includes(term));
        node.hidden = !matches;
        if (matches) count += 1;
      }
      return count;
    }

    function filterWiki() {
      const terms = searchable([search.value]).trim().split(/\s+/).filter(Boolean);
      const topicsFound = showMatches(topicIndex, terms);
      const sourcesFound = showMatches(sourceIndex, terms);
      get('concepts').hidden = topicsFound === 0;
      get('sources').hidden = sourcesFound === 0;
      get('empty-results').hidden = topicsFound + sourcesFound > 0;
      get('search-status').textContent = terms.length ? `${topicsFound} 個概念頁、${sourcesFound} 篇研究` : '';
      clear.hidden = !search.value;
    }

    search.addEventListener('input', filterWiki);
    clear.addEventListener('click', () => {
      search.value = '';
      filterWiki();
      search.focus();
    });

    function followAnchor() {
      let id;
      try {
        id = decodeURIComponent(location.hash.slice(1));
      } catch {
        return;
      }
      const target = get(id);
      if (!target) return;
      if (target.closest('[hidden]')) {
        search.value = '';
        filterWiki();
      }
      target.scrollIntoView();
    }

    document.addEventListener('click', event => {
      const anchor = event.target.closest('a[href^="#"]');
      if (!anchor || anchor.hash !== location.hash) return;
      followAnchor();
    });
    window.addEventListener('hashchange', followAnchor);
    if (location.hash) requestAnimationFrame(followAnchor);
  </script>
</body>
</html>
